name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        working-directory: evodron
        run: npm ci

      - name: Lint workspace
        working-directory: evodron
        run: npm run lint

      - name: Run tests
        env:
          EVODRON_JWT_SECRET: test-secret-ci-secret-ci-secret-ci
          EVODRON_DB_URL: file:/tmp/evodron-ci.db
          NODE_ENV: test
        working-directory: evodron
        run: npm test

      - name: Build workspace
        working-directory: evodron
        run: npm run build
