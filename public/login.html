<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evodron — Connexion</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="/" class="logo">Evodron</a>
    </div>
  </header>

  <main class="container form-page">
    <div class="card form-card">
      <h2>Se connecter</h2>
      <div id="form-error" class="alert alert-error hidden"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
      </form>
      <p class="form-footer">Pas encore inscrit ? <a href="/register.html">Créer un compte</a></p>
    </div>
  </main>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('form-error');
      errorEl.classList.add('hidden');

      try {
        const res  = await fetch('/api/auth/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({
            email:    document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          errorEl.textContent = data.error || 'Identifiants invalides.';
          errorEl.classList.remove('hidden');
          return;
        }
        localStorage.setItem('evodron_token', data.token);
        location.href = '/dashboard.html';
      } catch {
        errorEl.textContent = 'Erreur réseau. Veuillez réessayer.';
        errorEl.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
